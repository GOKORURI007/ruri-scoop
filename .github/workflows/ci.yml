name: CI

on:
  push:
    branches:
      - 'main'
      - 'master'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: windows-latest
    strategy:
      matrix:
        shell: [powershell, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - name: Checkout Bucket
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Need at least 2 commits to properly gather changed files for linting
          fetch-depth: 2
          path: 'my_bucket'
      - name: Checkout Scoop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ScoopInstaller/Scoop
          path: 'scoop_core'
      - name: Debug directory structure
        shell: pwsh
        run: |
          Write-Host "=== Current directory ==="
          pwd
          Write-Host "=== Repository root ==="
          (Get-Location).Path
          Write-Host "=== my_bucket contents ==="
          Get-ChildItem 'my_bucket' -Recurse -Depth 2 | Select-Object FullName
      - name: Install and cache test dependencies
        uses: potatoqualitee/psmodulecache@v6.3
        with:
          modules-to-cache: BuildHelpers, Pester
          shell: ${{ matrix.shell }}
      - name: Run tests
        run: |
          $env:SCOOP_HOME = (Convert-Path '.\scoop_core')
          Import-Module Pester -MinimumVersion 5.2.0
          $pesterConfig = New-PesterConfiguration -Hashtable @{
              Run    = @{
                  Path                     = '.\my_bucket'
                  PassThru                 = $true
                  FailOnNullOrEmptyForEach = $false
              }
              Output = @{ Verbosity = 'Detailed' }
              Should = @{ ErrorAction = 'Continue' }
          }
          $result = Invoke-Pester -Configuration $pesterConfig
          exit $result.FailedCount
